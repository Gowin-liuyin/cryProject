<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  LibreOffice（macOS 构建）在导出 PDF 时要用 fontconfig 找字体。
  本仓库自带的 LibreOffice 26.8.1.1 默认配置没有把 macOS 系统字体目录纳进来，
  于是中文字体找不到、导出的 PDF 里汉字整段丢失（2026-10-20 实测：
  官方作品设计报告 PDF 的中文全部不显示，只剩拉丁字符）。

  这里显式列出系统字体目录，并保留 LibreOffice 自带字体目录与它的本地配置，
  让导出时能用到 Songti / Heiti / Kaiti / 苹方等中文系统字体。
  缓存目录写相对路径（仓库 build/fonts-cache），由构建脚本预先创建。
-->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts/truetype</dir>
  <cachedir>build/fonts-cache</cachedir>
  <include ignore_missing="yes">/Applications/LibreOffice.app/Contents/Resources/fonts/truetype/fc_local.conf</include>
</fontconfig>
